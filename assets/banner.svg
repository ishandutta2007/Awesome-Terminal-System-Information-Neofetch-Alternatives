<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- CSS Animation Styles -->
    <style>
      .term-cursor {
        animation: blink 1s step-end infinite;
      }
      .pulse-pill {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scan 8s linear infinite;
      }
      .radar-wave {
        animation: ripple 4s ease-out infinite;
        transform-origin: 1060px 100px;
      }
      .radar-wave-delayed {
        animation: ripple 4s ease-out 2s infinite;
        transform-origin: 1060px 100px;
      }
      .sparkle {
        animation: floatSparkle 6s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.65; transform: scale(0.98); }
        100% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.4; }
        100% { transform: translateY(360px); opacity: 0.15; }
      }
      @keyframes ripple {
        0% { transform: scale(0.4); opacity: 0.8; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes floatSparkle {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-10px) rotate(15deg); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Circuit / Terminal Grid -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Glowing Dynamic Background Aura -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="260" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Radar Wave (Background Telemetry effect) -->
  <circle class="radar-wave" cx="1060" cy="100" r="40" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle class="radar-wave-delayed" cx="1060" cy="100" r="40" fill="none" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Scanning Line -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" stroke="url(#primary-grad)" stroke-width="2" opacity="0.3"/>

  <!-- Foreground Content Container -->
  <!-- Left Header & Branding Area -->
  <g transform="translate(60, 45)">
    <!-- Terminal Prompt Tag -->
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600" fill="#38bdf8">SYSTEM_FETCH // 01</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      Awesome <tspan fill="url(#primary-grad)">System Info</tspan>
    </text>
    <text x="0" y="115" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" letter-spacing="-0.01em">
      &amp; Neofetch Alternatives
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="152" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated CLI System Fetchers, Hardware Telemetry, Introspection &amp; Diagnostic Tools
    </text>

    <!-- Animated Badges / Pills (Foreground) -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Fastfetch -->
      <g class="pulse-pill" transform="translate(0, 0)">
        <rect x="0" y="0" width="112" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">⚡ Fastfetch</text>
      </g>
      <!-- Pill 2: btop -->
      <g class="pulse-pill" transform="translate(124, 0)">
        <rect x="0" y="0" width="88" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#818cf8">📊 btop</text>
      </g>
      <!-- Pill 3: witr -->
      <g class="pulse-pill" transform="translate(224, 0)">
        <rect x="0" y="0" width="84" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#c084fc">🔍 witr</text>
      </g>
      <!-- Pill 4: HWiNFO -->
      <g class="pulse-pill" transform="translate(320, 0)">
        <rect x="0" y="0" width="102" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">🌡️ HWiNFO</text>
      </g>
      <!-- Pill 5: CPU-Z -->
      <g class="pulse-pill" transform="translate(434, 0)">
        <rect x="0" y="0" width="94" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#fbbf24">⚙️ CPU-Z</text>
      </g>
    </g>

    <!-- OS Icons / Compatibility Tagline -->
    <g transform="translate(0, 245)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">
        SUPPORTED PLATFORMS: [ LINUX · MACOS · WINDOWS · BSD · ANDROID ]
      </text>
    </g>
  </g>

  <!-- Right Visual Area: Interactive Style Terminal Mockup Card -->
  <g transform="translate(730, 40)" filter="url(#card-shadow)">
    <!-- Terminal Window Frame -->
    <rect width="410" height="270" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect width="410" height="36" rx="12" fill="#1e293b"/>
    <rect y="24" width="410" height="12" fill="#1e293b"/>
    <!-- Window Controls -->
    <circle cx="22" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="18" r="5.5" fill="#10b981"/>
    <!-- Terminal Title -->
    <text x="205" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">terminal ~ fastfetch</text>

    <!-- Terminal Body / Simulated Fetch Output -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5">
      <!-- Mini ASCII Art / OS Logo on left -->
      <g fill="#38bdf8" font-weight="bold">
        <text x="0" y="18">    /\_/\    </text>
        <text x="0" y="34">   ( o.o )   </text>
        <text x="0" y="50">    &gt; ^ &lt;    </text>
        <text x="0" y="66">   /  -  \   </text>
        <text x="0" y="82">  /_/   \_\  </text>
      </g>

      <!-- System Details on right -->
      <g transform="translate(115, 0)">
        <text x="0" y="18" fill="#f43f5e" font-weight="bold">user<tspan fill="#64748b">@</tspan><tspan fill="#38bdf8">awesome-box</tspan></text>
        <line x1="0" y1="24" x2="245" y2="24" stroke="#475569" stroke-dasharray="3,3"/>
        <text x="0" y="42" fill="#94a3b8">OS: <tspan fill="#f1f5f9">Linux / Darwin / Win</tspan></text>
        <text x="0" y="60" fill="#94a3b8">Host: <tspan fill="#f1f5f9">Fastfetch x witr v2.0</tspan></text>
        <text x="0" y="78" fill="#94a3b8">Uptime: <tspan fill="#f1f5f9">99.99% Rock Solid</tspan></text>
        <text x="0" y="96" fill="#94a3b8">Sensors: <tspan fill="#34d399">Normal (38°C)</tspan></text>
        <text x="0" y="114" fill="#94a3b8">Memory: <tspan fill="#818cf8">1.42 GiB / 32.00 GiB</tspan></text>
      </g>

      <!-- Terminal Color Palette Bar -->
      <g transform="translate(10, 142)">
        <rect x="0" y="0" width="22" height="12" rx="3" fill="#000000"/>
        <rect x="26" y="0" width="22" height="12" rx="3" fill="#ef4444"/>
        <rect x="52" y="0" width="22" height="12" rx="3" fill="#22c55e"/>
        <rect x="78" y="0" width="22" height="12" rx="3" fill="#eab308"/>
        <rect x="104" y="0" width="22" height="12" rx="3" fill="#3b82f6"/>
        <rect x="130" y="0" width="22" height="12" rx="3" fill="#a855f7"/>
        <rect x="156" y="0" width="22" height="12" rx="3" fill="#06b6d4"/>
        <rect x="182" y="0" width="22" height="12" rx="3" fill="#ffffff"/>
      </g>

      <!-- Live Terminal Input Line with Blinking Cursor -->
      <g transform="translate(10, 180)">
        <text x="0" y="0" fill="#38bdf8" font-weight="bold">$</text>
        <text x="14" y="0" fill="#e2e8f0">fastfetch --logo-type kitty</text>
        <rect class="term-cursor" x="226" y="-11" width="8" height="14" fill="#38bdf8"/>
      </g>
    </g>
  </g>

  <!-- Border Highlight Outline -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.4"/>
</svg>
